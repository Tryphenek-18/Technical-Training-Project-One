name: Contribution Quotidienne Automatique

on:
  schedule:
    - cron: '0 12 * * *' # S'exécute chaque jour à 12h00 UTC
  workflow_dispatch: # Permet de le lancer manuellement pour tester

jobs:
  make-contribution:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Git
      run: |
        git config --global user.name "Tryphenek-18"
        git config --global user.email "ket.180804@gmail.com"

    - name: Générer plusieurs commits (Boucle)
      run: |
        # Boucle qui s'exécute 12 fois pour garantir plus de 10 commits
        for i in {1..12}
        do
          echo "Activité de la boucle $i le : $(date)" > daily_log.txt
          git add daily_log.txt
          git commit -m "Mise à jour automatique - Commit $i/12"
        done

    - name: Push les modifications
      run: |
        git push
